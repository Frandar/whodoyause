AWSTemplateFormatVersion: '2010-09-09'

Description: >
  WhoDoYaUse frontend hosting — private S3 bucket served via CloudFront with an
  Origin Access Control (OAC), fronted by the whodoyause.com custom domain.
  Separate stack from the backend Lambda so the frontend and backend have
  independent lifecycles.

Parameters:
  BucketName:
    Type: String
    Default: whodoyause-frontend-prod
    Description: >
      Globally-unique S3 bucket name for the static site. Override if this name
      is already taken.
  DomainName:
    Type: String
    Default: whodoyause.com
    Description: >
      Apex domain. This is the canonical origin — www redirects here, and it is
      what NEXT_PUBLIC_SITE_URL and the Lambda's CorsAllowOrigin must be set to.
  HostedZoneId:
    Type: String
    Default: Z0688328UYJ1HCG6JV5C
    Description: >
      Route 53 public hosted zone for DomainName. Created by the registrar when
      the domain was bought; the registrar's nameservers already point at it.

Resources:
  # CloudFront only accepts certificates from us-east-1, regardless of where the
  # rest of the stack lives. This one is DNS-validated: because DomainValidationOptions
  # names the hosted zone, CloudFormation writes the _acme CNAMEs itself and blocks
  # the stack update until ACM issues. No manual copy-paste of validation records.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId

  # Rewrites clean paths to their .html files before S3 sees the request.
  # Without this, /browse → S3 key "browse" (404/403) → falls back to index.html.
  # Next.js static export emits browse.html, recommend.html, etc.
  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: whodoyause-url-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to apex, then append .html for static-export paths
        Runtime: cloudfront-js-1.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;

          // One canonical host. www.${DomainName} is on the certificate and the
          // distribution purely so it resolves — it never serves content, it
          // 301s to the apex, preserving path and query string.
          var host = request.headers.host && request.headers.host.value;
          if (host === 'www.${DomainName}') {
            var pairs = [];
            for (var key in request.querystring) {
              var q = request.querystring[key];
              // Keys and values arrive STILL PERCENT-ENCODED, so they are copied
              // through verbatim. Running encodeURIComponent over them here turned
              // ?category=Lawn%2FLandscaping into Lawn%252FLandscaping and broke
              // every shared category link that went through www.
              if (q.multiValue) {
                for (var m = 0; m < q.multiValue.length; m++) {
                  pairs.push(key + '=' + q.multiValue[m].value);
                }
              } else {
                pairs.push(key + '=' + q.value);
              }
            }
            var search = pairs.length ? '?' + pairs.join('&') : '';
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://${DomainName}' + request.uri + search }
              }
            };
          }

          var uri = request.uri;
          // Extensionless files emitted by the Next build that are NOT pages —
          // appending .html to these would 404 them. The OG image is the one
          // that matters: break it and every Facebook share loses its card.
          var ASSET_ROUTES = ['/opengraph-image', '/twitter-image', '/icon', '/apple-icon'];
          for (var i = 0; i < ASSET_ROUTES.length; i++) {
            if (uri === ASSET_ROUTES[i]) return request;
          }
          // Root is handled by DefaultRootObject. Skip anything with a dot
          // (assets, _next/, robots.txt, sitemap.xml). Append .html to clean
          // app routes.
          if (uri !== '/' && uri.indexOf('.') === -1) {
            request.uri = uri + '.html';
          }
          return request;
        }

  # Private bucket — never public. CloudFront reaches it only via the OAC below.
  HostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced   # disables ACLs (recommended)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: WhoDoYaUse frontend
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100          # cheapest: US / Canada / Europe edges
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt HostingBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''       # empty when using OAC (not legacy OAI)
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed "CachingOptimized" policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        # A private S3 bucket returns 403 for any missing key. Serve the real
        # 404 page WITH a 404 status: the previous 200 + /index.html turned every
        # typo'd URL into a soft 404 that rendered the homepage and told search
        # engines it was a valid page. Next's static export emits 404.html, which
        # was being generated and never served.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # Grant CloudFront (this distribution only) read access to the bucket.
  HostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HostingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${HostingBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}'

  # Alias records, not CNAMEs: a CNAME is illegal at the zone apex, and aliases
  # are free to query. Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone id — the
  # same constant for every distribution in every region, not a value to look up.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      # Repetitive on purpose: CloudFormation does not support YAML anchors, so
      # the alias target is spelled out four times (v4 + v6, apex + www).
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub 'www.${DomainName}'
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub 'www.${DomainName}'
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

Outputs:
  BucketName:
    Description: S3 bucket name — pass as BUCKET to scripts/deploy.sh
    Value: !Ref HostingBucket
  DistributionId:
    Description: CloudFront distribution ID — pass as DIST_ID to scripts/deploy.sh
    Value: !Ref Distribution
  SiteUrl:
    Description: >
      Canonical public URL — this is what NEXT_PUBLIC_SITE_URL and the Lambda's
      CorsAllowOrigin must be set to.
    Value: !Sub 'https://${DomainName}'
  CloudFrontUrl:
    Description: >
      The distribution's own domain. Still serves the site, but is no longer the
      public address and is NOT in the API's CORS allow-list.
    Value: !Sub 'https://${Distribution.DomainName}'
