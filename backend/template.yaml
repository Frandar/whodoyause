AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Neighborhood Recommendations Platform — Lambda backend

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        SUPABASE_URL: !Ref SupabaseUrl
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
        MODERATOR_USER_IDS: !Ref ModeratorUserIds

Parameters:
  DatabaseUrl:
    Type: String
    Description: Supabase pooler connection string (port 6543, transaction mode)
    NoEcho: true
  SupabaseUrl:
    Type: String
    Description: Supabase project URL (e.g. https://xxxx.supabase.co)
  CorsAllowOrigin:
    Type: String
    Description: CloudFront distribution URL (e.g. https://dxxxx.cloudfront.net)
  ModeratorUserIds:
    Type: String
    Default: ''
    Description: >
      Comma-separated Supabase user ids permitted to DELETE recommendations
      (spam/abuse moderation). Empty means nobody can moderate — fail closed.
      This is an allow-list, not a role system; see ARCHITECTURE §0.

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: whodoyause-api
      CodeUri: .
      Handler: src.handler.lambda_handler
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowCredentials: false
          AllowHeaders:
            - Authorization
            - Content-Type
          # NOTE: Lambda Function URL CORS does not accept OPTIONS here — preflight
          # is handled automatically by AWS. Listing OPTIONS fails CloudFormation
          # early validation. Valid values: GET, HEAD, POST, PUT, PATCH, DELETE, *.
          AllowMethods:
            - GET
            - POST
            - PATCH
            - DELETE
          AllowOrigins:
            - !Ref CorsAllowOrigin
      # No explicit Policies: SAM attaches AWSLambdaBasicExecutionRole by default,
      # which scopes CloudWatch Logs to this function's own log group. The service
      # needs nothing more (it talks to Postgres over the network, not via IAM).

  # NOTE: log retention is deliberately NOT managed here.
  # Lambda created /aws/lambda/whodoyause-api implicitly on the first deploy, so
  # an AWS::Logs::LogGroup resource fails the changeset with
  # ResourceExistenceCheck — CloudFormation cannot create a group that already
  # exists, and importing it into the stack is more machinery than a 2-person
  # MVP should carry. Retention is set out-of-band instead (30 days):
  #
  #   aws logs put-retention-policy \
  #     --log-group-name /aws/lambda/whodoyause-api --retention-in-days 30
  #
  # That setting persists and survives redeploys. If this stack is ever recreated
  # from scratch, re-run the command (or add the resource back — on a fresh
  # account there is no group to collide with).

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: whodoyause-api-errors
      AlarmDescription: Lambda function error rate >= 1 over 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionUrl:
    Description: Lambda Function URL (use as NEXT_PUBLIC_API_BASE)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
